<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice 1 - HTML Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My HTML Profile Page</h1>
    <p>Hello! I am a student at the University of Kansas learning software engineering.</p>
    
    <!-- Photo -->
    <img src="pictures/profile.jpg" alt="Profile Picture" width="200" height="200" border="1">
    
    <!-- Hyperlink -->
    <p>Visit the official KU website: <a href="https://www.ku.edu">KU Homepage</a></p>
    
    <!-- Video -->
    <div>
        <h3>Sample Embedded Video</h3>
        <iframe width="560" height="315" 
            src="https://www.youtube.com/embed/1qBsuvttm0g" 
            title="YouTube video player" frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen></iframe>
    </div>
</body>
</html>
